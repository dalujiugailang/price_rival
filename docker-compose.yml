services:
  price-rival:
    build: .
    image: price-rival:latest
    container_name: price-rival
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DAILY_PRICE_LOOKUP_URL: ${DAILY_PRICE_LOOKUP_URL:-https://daily-price.gtmdudu.xyz/api/lookup}
      DAILY_PRICE_BRAND_LOOKUP_URL: ${DAILY_PRICE_BRAND_LOOKUP_URL:-https://daily-price.gtmdudu.xyz/api/zz-competitiveness/lookup}
      DAILY_PRICE_TOKEN: ${DAILY_PRICE_TOKEN:-}
      ANDROID_REVENUE_SUPABASE_URL: ${ANDROID_REVENUE_SUPABASE_URL:-https://effaryjuqgzeegkzxnij.supabase.co}
      ANDROID_REVENUE_SUPABASE_PUBLISHABLE_KEY: ${ANDROID_REVENUE_SUPABASE_PUBLISHABLE_KEY:-}
      ANDROID_REVENUE_METRICS_API_KEY: ${ANDROID_REVENUE_METRICS_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      RISK_OCR_URL: http://risk-ocr:8080
      DATABASE_PATH: /app/data/price-rival.sqlite
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-}
      FEISHU_ALLOWED_DEPARTMENT_IDS: ${FEISHU_ALLOWED_DEPARTMENT_IDS:-}
      FEISHU_ALLOWED_OPEN_IDS: ${FEISHU_ALLOWED_OPEN_IDS:-}
      FEISHU_ADMIN_OPEN_IDS: ${FEISHU_ADMIN_OPEN_IDS:-}
      FEISHU_READ_ONLY_DEPARTMENT_IDS: ${FEISHU_READ_ONLY_DEPARTMENT_IDS:-}
      FEISHU_READ_ONLY_OPEN_IDS: ${FEISHU_READ_ONLY_OPEN_IDS:-}
      FEISHU_ALLOWED_TENANT_KEYS: ${FEISHU_ALLOWED_TENANT_KEYS:-}
    networks:
      - default
      - ocr-internal
    volumes:
      - ./data:/app/data

  risk-ocr:
    build:
      context: ./ocr
      network: host
    image: price-rival-ocr:latest
    container_name: price-rival-ocr
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m
    networks:
      - ocr-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
networks:
  ocr-internal:
    internal: true
